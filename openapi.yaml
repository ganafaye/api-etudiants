openapi: 3.0.3

info:
  title: API Gestion des Étudiants
  version: 1.0.0
  description: |
    # Présentation

    API REST permettant de gérer les étudiants d'un établissement
    d'enseignement supérieur.

    Cette API expose les fonctionnalités CRUD :
    - Create : création d'un étudiant.
    - Read : consultation de la liste et du détail d'un étudiant.
    - Update : modification d'un étudiant.
    - Delete : suppression d'un étudiant.

    ## Gestion des erreurs

    Les erreurs utilisent un format uniforme inspiré de la RFC 9457
    (Problem Details for HTTP APIs).

    Chaque erreur contient un code HTTP, un code métier, un titre
    et une explication destinée au consommateur de l'API.

    ## Format des échanges

    - Format des données : JSON.
    - Protocole : HTTP/HTTPS.
    - Encodage : UTF-8.

  contact:
    name: Équipe API Gestion des Étudiants
    email: support@example.com

  license:
    name: MIT

servers:
  - url: https://api-etudiants.example.com
    description: Serveur de production (adresse illustrative)

  - url: http://localhost:8080
    description: Serveur local de développement

tags:
  - name: Etudiants
    description: Opérations CRUD de gestion des étudiants

paths:

  /api/etudiants:

    get:
      tags:
        - Etudiants
      summary: Récupérer tous les étudiants
      description: |
        Retourne la liste complète des étudiants enregistrés.

        Si aucun étudiant n'est disponible, une liste vide est retournée.
      operationId: getEtudiants

      responses:
        '200':
          description: Liste des étudiants récupérée avec succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Etudiant'
              example:
                - id: 1
                  nom: Faye
                  prenom: Gana
                  email: gana@example.com
                  filiere: Systèmes d'information
                  niveau: Master 2

                - id: 2
                  nom: Diop
                  prenom: Moussa
                  email: moussa@example.com
                  filiere: Informatique
                  niveau: Licence 3

        '500':
          $ref: '#/components/responses/ServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      tags:
        - Etudiants
      summary: Créer un nouvel étudiant
      description: |
        Enregistre un nouvel étudiant.

        L'identifiant est généré automatiquement par le serveur.

        L'adresse email doit être unique dans le système.
      operationId: createEtudiant

      requestBody:
        required: true
        description: Informations nécessaires à la création de l'étudiant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtudiantRequest'
            example:
              nom: Fall
              prenom: Aminata
              email: aminata@example.com
              filiere: Data Science
              niveau: Master 2

      responses:
        '201':
          description: Étudiant créé avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
              example:
                id: 3
                nom: Fall
                prenom: Aminata
                email: aminata@example.com
                filiere: Data Science
                niveau: Master 2

        '400':
          $ref: '#/components/responses/ValidationError'

        '409':
          $ref: '#/components/responses/EmailConflict'

        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

        '500':
          $ref: '#/components/responses/ServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /api/etudiants/{id}:

    parameters:
      - name: id
        in: path
        required: true
        description: Identifiant unique de l'étudiant.
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 1

    get:
      tags:
        - Etudiants
      summary: Récupérer un étudiant par son identifiant
      description: |
        Recherche et retourne un étudiant à partir de son identifiant.

        Si aucun étudiant ne correspond à l'identifiant fourni,
        une erreur STUDENT_NOT_FOUND est retournée.
      operationId: getEtudiantById

      responses:
        '200':
          description: Étudiant trouvé avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
              example:
                id: 1
                nom: Faye
                prenom: Gana
                email: gana@example.com
                filiere: Systèmes d'information
                niveau: Master 2

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/ServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


    put:
      tags:
        - Etudiants
      summary: Modifier un étudiant
      description: |
        Remplace les informations modifiables d'un étudiant existant.

        Toutes les propriétés de EtudiantRequest sont obligatoires.
        L'identifiant de l'étudiant est transmis dans l'URL.

        L'adresse email doit rester unique.
      operationId: updateEtudiant

      requestBody:
        required: true
        description: Nouvelles informations de l'étudiant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtudiantRequest'
            example:
              nom: Faye
              prenom: Gana
              email: gana.faye@example.com
              filiere: Systèmes d'information
              niveau: Master 2

      responses:
        '200':
          description: Étudiant modifié avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etudiant'
              example:
                id: 1
                nom: Faye
                prenom: Gana
                email: gana.faye@example.com
                filiere: Systèmes d'information
                niveau: Master 2

        '400':
          $ref: '#/components/responses/ValidationError'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/EmailConflict'

        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

        '500':
          $ref: '#/components/responses/ServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


    delete:
      tags:
        - Etudiants
      summary: Supprimer un étudiant
      description: |
        Supprime définitivement un étudiant à partir de son identifiant.

        En cas de succès, le serveur retourne HTTP 204 sans corps
        de réponse.
      operationId: deleteEtudiant

      responses:
        '204':
          description: Étudiant supprimé avec succès. Aucune réponse JSON.

        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/ServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


components:

  schemas:

    Etudiant:
      type: object
      description: |
        Représentation complète d'un étudiant enregistré dans le système.
      required:
        - id
        - nom
        - prenom
        - email
        - filiere
        - niveau

      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Identifiant unique généré automatiquement.
          example: 1

        nom:
          type: string
          minLength: 2
          maxLength: 100
          description: Nom de famille de l'étudiant.
          example: Faye

        prenom:
          type: string
          minLength: 2
          maxLength: 100
          description: Prénom de l'étudiant.
          example: Gana

        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Adresse électronique de l'étudiant.
            Cette adresse doit être unique.
          example: gana@example.com

        filiere:
          type: string
          minLength: 2
          maxLength: 150
          description: Filière ou spécialité de formation.
          example: Systèmes d'information

        niveau:
          type: string
          description: Niveau académique de l'étudiant.
          enum:
            - Licence 1
            - Licence 2
            - Licence 3
            - Master 1
            - Master 2
          example: Master 2


    EtudiantRequest:
      type: object
      description: |
        Données nécessaires à la création ou à la modification
        d'un étudiant.

        L'identifiant n'est pas fourni par le client.
      required:
        - nom
        - prenom
        - email
        - filiere
        - niveau

      properties:
        nom:
          type: string
          minLength: 2
          maxLength: 100
          description: Nom de famille.
          example: Faye

        prenom:
          type: string
          minLength: 2
          maxLength: 100
          description: Prénom.
          example: Gana

        email:
          type: string
          format: email
          maxLength: 254
          description: Adresse email unique.
          example: gana@example.com

        filiere:
          type: string
          minLength: 2
          maxLength: 150
          description: Filière de formation.
          example: Systèmes d'information

        niveau:
          type: string
          enum:
            - Licence 1
            - Licence 2
            - Licence 3
            - Master 1
            - Master 2
          description: Niveau académique.
          example: Master 2


    ErrorResponse:
      type: object
      description: |
        Format standardisé des erreurs de l'API.

        Inspiré de la RFC 9457, avec des propriétés supplémentaires
        pour faciliter le traitement des erreurs par les clients.
      required:
        - type
        - title
        - status
        - code
        - detail
        - instance
        - timestamp

      properties:
        type:
          type: string
          format: uri
          description: URI identifiant la catégorie du problème.
          example: https://api.example.com/errors/student-not-found

        title:
          type: string
          description: Résumé général et compréhensible du problème.
          example: Étudiant introuvable

        status:
          type: integer
          description: Code de statut HTTP associé à l'erreur.
          example: 404

        code:
          type: string
          description: |
            Identifiant métier stable et unique.
            Permet au frontend d'identifier précisément l'erreur.
          example: STUDENT_NOT_FOUND

        detail:
          type: string
          description: Explication détaillée destinée au consommateur.
          example: Aucun étudiant ne correspond à cet identifiant.

        instance:
          type: string
          description: Chemin de la requête ayant provoqué l'erreur.
          example: /api/etudiants/99

        timestamp:
          type: string
          format: date-time
          description: Date et heure de production de l'erreur.
          example: "2026-11-21T14:30:00Z"

        errors:
          type: array
          description: |
            Liste facultative des erreurs associées aux champs
            d'une requête invalide.
          items:
            $ref: '#/components/schemas/FieldError'


    FieldError:
      type: object
      description: Détail d'une erreur concernant un champ particulier.
      required:
        - field
        - message

      properties:
        field:
          type: string
          description: Nom du champ concerné.
          example: email

        rejectedValue:
          description: |
            Valeur rejetée lorsqu'elle peut être exposée sans risque.
          example: adresse-invalide

        message:
          type: string
          description: Explication de l'erreur et indication de correction.
          example: Le format de l'adresse email est invalide.


  responses:

    ValidationError:
      description: |
        Les données envoyées ne respectent pas les règles de validation.
        Le tableau errors précise les champs concernés.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: https://api.example.com/errors/validation
            title: Erreur de validation
            status: 400
            code: VALIDATION_ERROR
            detail: Certaines données fournies sont invalides.
            instance: /api/etudiants
            timestamp: "2026-11-21T14:30:00Z"
            errors:
              - field: email
                rejectedValue: adresse-invalide
                message: Le format de l'adresse email est invalide.
              - field: nom
                rejectedValue: A
                message: Le nom doit contenir au moins 2 caractères.


    InvalidRequest:
      description: La requête est mal formée ou contient un JSON invalide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: https://api.example.com/errors/invalid-request
            title: Requête invalide
            status: 400
            code: INVALID_REQUEST
            detail: Le corps de la requête contient un JSON invalide.
            instance: /api/etudiants
            timestamp: "2026-11-21T14:30:00Z"


    NotFound:
      description: L'étudiant demandé n'existe pas.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: https://api.example.com/errors/student-not-found
            title: Étudiant introuvable
            status: 404
            code: STUDENT_NOT_FOUND
            detail: Aucun étudiant ne correspond à cet identifiant.
            instance: /api/etudiants/99
            timestamp: "2026-11-21T14:30:00Z"


    EmailConflict:
      description: L'adresse email est déjà utilisée par un autre étudiant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: https://api.example.com/errors/email-already-exists
            title: Conflit de données
            status: 409
            code: EMAIL_ALREADY_EXISTS
            detail: Un étudiant possède déjà cette adresse email.
            instance: /api/etudiants
            timestamp: "2026-11-21T14:30:00Z"
            errors:
              - field: email
                rejectedValue: gana@example.com
                message: Cette adresse email est déjà utilisée.


    UnsupportedMediaType:
      description: Le type de contenu envoyé n'est pas accepté.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: https://api.example.com/errors/unsupported-media-type
            title: Format non supporté
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            detail: Le format de la requête doit être application/json.
            instance: /api/etudiants
            timestamp: "2026-11-21T14:30:00Z"


    ServerError:
      description: Une erreur interne inattendue est survenue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: https://api.example.com/errors/internal-server-error
            title: Erreur interne du serveur
            status: 500
            code: INTERNAL_SERVER_ERROR
            detail: Une erreur inattendue est survenue. Veuillez réessayer ultérieurement.
            instance: /api/etudiants
            timestamp: "2026-11-21T14:30:00Z"


    ServiceUnavailable:
      description: Le service est temporairement indisponible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: https://api.example.com/errors/service-unavailable
            title: Service indisponible
            status: 503
            code: SERVICE_UNAVAILABLE
            detail: Le service est temporairement indisponible. Veuillez réessayer plus tard.
            instance: /api/etudiants
            timestamp: "2026-11-21T14:30:00Z"