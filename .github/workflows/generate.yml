name: API Students CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-code:
    name: Validation, génération et préparation du package
    runs-on: ubuntu-latest

    # Permissions nécessaires à GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Récupérer le dépôt
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # 2. Configurer Node.js et GitHub Packages
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@ganafaye'

      # 3. Vérifier la présence du contrat
      - name: Vérifier la présence du contrat
        run: |
          if [ -f openapi.yaml ]; then
            echo "Contrat OpenAPI trouvé."
          else
            echo "ERREUR : openapi.yaml introuvable."
            exit 1
          fi

      # 4. Valider le contrat OpenAPI
      - name: Valider le contrat OpenAPI
        run: npx --yes @redocly/cli lint openapi.yaml

      # 5. Générer le package npm TypeScript
      - name: Générer le client TypeScript
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g typescript-fetch \
            -o /local/generated/typescript-client \
            --additional-properties=npmName=@ganafaye/api-etudiants-client,npmVersion=1.0.0

      # 6. Corriger les permissions des fichiers générés
      - name: Corriger les permissions
        run: |
          sudo chown -R "$USER:$USER" generated/typescript-client

      # 7. Personnaliser les métadonnées du package
      - name: Configurer les métadonnées npm
        working-directory: generated/typescript-client
        run: |
          npm pkg set "description=Client TypeScript généré automatiquement pour l'API de gestion des étudiants"
          npm pkg set "author=Gana Faye"
          npm pkg set "repository.url=https://github.com/ganafaye/api-etudiants.git"

      # 8. Installer les dépendances et compiler le package
      - name: Installer et compiler le package npm
        working-directory: generated/typescript-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --ignore-scripts
          npm run build

      # 9. Générer le serveur Java Spring Boot
      - name: Générer le serveur Java
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g spring \
            -o /local/generated/java-server

      # 10. Conserver les artefacts générés
      - name: Conserver les artefacts générés
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: generated/
          if-no-files-found: error
          retention-days: 7