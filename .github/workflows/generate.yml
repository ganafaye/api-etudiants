name: API Students CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-code:
    name: Validation, génération et publication des packages
    runs-on: ubuntu-latest

    # Permissions nécessaires à GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Récupérer le dépôt
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # 2. Configurer Node.js et GitHub Packages
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@ganafaye'

      # 3. Vérifier la présence du contrat
      - name: Vérifier la présence du contrat
        run: |
          if [ -f openapi.yaml ]; then
            echo "Contrat OpenAPI trouvé."
          else
            echo "ERREUR : openapi.yaml introuvable."
            exit 1
          fi

      # 4. Valider le contrat OpenAPI
      - name: Valider le contrat OpenAPI
        run: npx --yes @redocly/cli lint openapi.yaml

      # 5. Générer le client TypeScript
      - name: Générer le client TypeScript
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g typescript-fetch \
            -o /local/generated/typescript-client \
            --additional-properties=npmName=@ganafaye/api-etudiants-client,npmVersion=1.0.1

      # 6. Corriger les permissions des fichiers générés
      - name: Corriger les permissions TypeScript
        run: |
          sudo chown -R "$USER:$USER" generated/typescript-client

      # 7. Personnaliser les métadonnées npm
      - name: Configurer les métadonnées npm
        working-directory: generated/typescript-client
        run: |
          npm pkg set "description=Client TypeScript généré automatiquement pour l'API de gestion des étudiants"
          npm pkg set "author=Gana Faye"
          npm pkg set "repository.url=https://github.com/ganafaye/api-etudiants.git"

      # 8. Installer les dépendances et compiler le package npm
      - name: Installer et compiler le package npm
        working-directory: generated/typescript-client
        run: |
          npm install --ignore-scripts
          npm run build

      # 9. Générer le serveur Java Spring Boot
      - name: Générer le serveur Java
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g spring \
            -o /local/generated/java-server

      # 10. Corriger les permissions des fichiers Java générés
      - name: Corriger les permissions Java
        run: |
          sudo chown -R "$USER:$USER" generated/java-server

      # 11. Configurer Java et Maven
      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ github.workspace }}

      # 12. Personnaliser les coordonnées Maven
      - name: Personnaliser le package Maven
        working-directory: generated/java-server
        run: |
          # Modifier la version Maven
          mvn -B versions:set \
            -DnewVersion=1.0.0 \
            -DgenerateBackupPoms=false

          # Modifier uniquement le groupId principal du projet
          sed -i '0,/<groupId>org.openapitools<\/groupId>/s//<groupId>com.ganafaye<\/groupId>/' pom.xml

          # Modifier uniquement l'artifactId principal du projet
          sed -i '0,/<artifactId>openapi-spring<\/artifactId>/s//<artifactId>api-etudiants-server<\/artifactId>/' pom.xml

          # Vérifier les coordonnées finales
          echo "Coordonnées Maven configurées :"
          grep -A 5 '<modelVersion>' pom.xml

          # Vérifier la dépendance Jackson
          echo "Vérification de jackson-databind-nullable :"
          grep -B 1 -A 2 'jackson-databind-nullable' pom.xml

      # 13. Construire et publier le package Maven
      - name: Construire et publier le package Maven
        if: github.event_name != 'pull_request'
        working-directory: generated/java-server
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Vérifier la présence du fichier settings.xml
          if [ ! -f "${{ github.workspace }}/settings.xml" ]; then
            echo "ERREUR : fichier settings.xml introuvable."
            exit 1
          fi

          # Vérifier la disponibilité du token
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "ERREUR : GITHUB_TOKEN est absent."
            exit 1
          fi

          echo "Configuration Maven trouvée."
          echo "Authentification GitHub disponible."

          # Construire et publier le package Maven
          mvn -B \
            -s "${{ github.workspace }}/settings.xml" \
            deploy \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/ganafaye/api-etudiants

      # 14. Conserver les artefacts générés
      - name: Conserver les artefacts générés
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: generated/
          if-no-files-found: error
          retention-days: 7

      # 15. Publier le package npm sur GitHub Packages
      - name: Publier le package npm
        if: github.event_name != 'pull_request'
        working-directory: generated/typescript-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --registry=https://npm.pkg.github.com