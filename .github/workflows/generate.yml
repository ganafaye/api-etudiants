name: API Students CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Version commune automatique des trois packages
# Exemple : 1.1.25-build.1
env:
  PACKAGE_VERSION: 1.1.${{ github.run_number }}-build.${{ github.run_attempt }}

jobs:
  generate-code:
    name: Validation, génération et publication des packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # 1. Récupérer le dépôt
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # 2. Configurer Node.js et GitHub Packages
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@ganafaye'

      # 3. Vérifier la présence du contrat
      - name: Vérifier la présence du contrat
        run: |
          if [ -f openapi.yaml ]; then
            echo "Contrat OpenAPI trouvé."
          else
            echo "ERREUR : openapi.yaml introuvable."
            exit 1
          fi

      # 4. Valider le contrat OpenAPI
      - name: Valider le contrat OpenAPI
        run: npx --yes @redocly/cli lint openapi.yaml

      # 5. Afficher la version automatique
      - name: Déterminer la version des packages
        run: |
          echo "Version commune : ${{ env.PACKAGE_VERSION }}"

      # 6. Générer le client TypeScript
      - name: Générer le client TypeScript
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g typescript-fetch \
            -o /local/generated/typescript-client \
            --additional-properties=npmName=@ganafaye/api-etudiants-client,npmVersion=${{ env.PACKAGE_VERSION }}

      # 7. Corriger les permissions TypeScript
      - name: Corriger les permissions TypeScript
        run: |
          sudo chown -R "$USER:$USER" generated/typescript-client

      # 8. Configurer les métadonnées npm
      - name: Configurer les métadonnées npm
        working-directory: generated/typescript-client
        run: |
          npm pkg set "description=Client TypeScript généré automatiquement pour l'API de gestion des étudiants"
          npm pkg set "author=Gana Faye"
          npm pkg set "repository.url=https://github.com/ganafaye/api-etudiants.git"

      # 9. Installer les dépendances et compiler le package npm
      - name: Installer et compiler le package npm
        working-directory: generated/typescript-client
        run: |
          npm install --ignore-scripts
          npm run build

      # 10. Générer le serveur Java Spring Boot
      - name: Générer le serveur Java
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g spring \
            -o /local/generated/java-server

      # 11. Générer la bibliothèque Java réutilisable
      - name: Générer la bibliothèque Java Models
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g spring \
            -o /local/generated/java-models \
            --additional-properties=interfaceOnly=true,modelPackage=com.ganafaye.api.etudiants.model,apiPackage=com.ganafaye.api.etudiants.api,useSpringBoot3=true

      # 12. Corriger les permissions des fichiers Java
      - name: Corriger les permissions Java
        run: |
          sudo chown -R "$USER:$USER" generated/java-server
          sudo chown -R "$USER:$USER" generated/java-models

      # 13. Configurer Java et Maven
      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ github.workspace }}

      # 14. Personnaliser les coordonnées Maven du serveur
      - name: Configurer le package Maven Server
        working-directory: generated/java-server
        run: |
          mvn -B versions:set \
            -DnewVersion=${{ env.PACKAGE_VERSION }} \
            -DgenerateBackupPoms=false

          sed -i '0,/<groupId>org.openapitools<\/groupId>/s//<groupId>com.ganafaye<\/groupId>/' pom.xml

          sed -i '0,/<artifactId>openapi-spring<\/artifactId>/s//<artifactId>api-etudiants-server<\/artifactId>/' pom.xml

          echo "Coordonnées Maven Server :"
          grep -A 5 '<modelVersion>' pom.xml

      # 15. Personnaliser les coordonnées Maven de la bibliothèque
      - name: Configurer le package Maven Models
        working-directory: generated/java-models
        run: |
          mvn -B versions:set \
            -DnewVersion=${{ env.PACKAGE_VERSION }} \
            -DgenerateBackupPoms=false

          sed -i '0,/<groupId>org.openapitools<\/groupId>/s//<groupId>com.ganafaye<\/groupId>/' pom.xml

          sed -i '0,/<artifactId>openapi-spring<\/artifactId>/s//<artifactId>api-etudiants-models<\/artifactId>/' pom.xml

          echo "Coordonnées Maven Models :"
          grep -A 5 '<modelVersion>' pom.xml

      # 16. Compiler et vérifier la bibliothèque Java
      - name: Compiler et vérifier Java Models
        working-directory: generated/java-models
        run: |
          mvn -B clean package \
            -Dspring-boot.repackage.skip=true

          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*.original" | head -1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERREUR : aucun JAR généré."
            exit 1
          fi

          echo "JAR généré : $JAR_FILE"

          if jar tf "$JAR_FILE" | grep -q '^BOOT-INF/'; then
            echo "ERREUR : le JAR contient encore BOOT-INF."
            exit 1
          fi

          echo "Bibliothèque Java classique détectée."

          jar tf "$JAR_FILE" | grep '\.class$' | head -20

      # 17. Vérifier les paramètres de publication
      - name: Vérifier la configuration GitHub Packages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "${{ github.workspace }}/settings.xml" ]; then
            echo "ERREUR : fichier settings.xml introuvable."
            exit 1
          fi

          if [ -z "$GITHUB_TOKEN" ]; then
            echo "ERREUR : GITHUB_TOKEN est absent."
            exit 1
          fi

          echo "Configuration Maven trouvée."
          echo "Authentification GitHub disponible."

      # 18. Publier la bibliothèque Java Models
      - name: Publier le package Maven Models
        if: github.event_name != 'pull_request'
        working-directory: generated/java-models
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B \
            -s "${{ github.workspace }}/settings.xml" \
            deploy \
            -Dspring-boot.repackage.skip=true \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/ganafaye/api-etudiants

      # 19. Construire et publier le serveur Spring Boot
      - name: Construire et publier le package Maven Server
        if: github.event_name != 'pull_request'
        working-directory: generated/java-server
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B \
            -s "${{ github.workspace }}/settings.xml" \
            deploy \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/ganafaye/api-etudiants

      # 20. Publier le package npm
      - name: Publier le package npm
        if: github.event_name != 'pull_request'
        working-directory: generated/typescript-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --registry=https://npm.pkg.github.com

      # 21. Conserver les artefacts générés
      - name: Conserver les artefacts générés
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: generated/
          if-no-files-found: error
          retention-days: 7