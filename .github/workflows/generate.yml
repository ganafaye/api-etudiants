name: API Students CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-workflow:
    name: Vérification du contrat OpenAPI
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier la présence du contrat
        run: |
          if [ -f openapi.yaml ]; then
            echo "Contrat OpenAPI trouvé."
          else
            echo "ERREUR : openapi.yaml introuvable."
            exit 1
          fi

      - name: Valider le contrat OpenAPI
        run: npx --yes @redocly/cli lint openapi.yaml